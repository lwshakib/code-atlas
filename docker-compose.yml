version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: code-atlas-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/FrUA4Xt8w_V6VSyzGIPP2Bo1aIu3UGGTd74i2UJSuDE
      - NEO4J_PLUGINS=["apoc"]
